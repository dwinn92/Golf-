# Netlify config for the What the Fluff site.
# The site is plain static HTML — nothing to build, just publish this folder.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The page generator lives in the repo, not on the web.
[[redirects]]
  from = "/_build/*"
  to = "/404.html"
  status = 404
  force = true

# Pretty URLs for the two section hubs.
[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/guides"
  to = "/guides/"
  status = 301

# Old Walkies with Gemma paths, in case anything still points at them.
[[redirects]]
  from = "/walkies-with-gemma"
  to = "/"
  status = 301

[[redirects]]
  from = "/dog-walking"
  to = "/services/dog-walking.html"
  status = 301

[[redirects]]
  from = "/cat-visits"
  to = "/services/pet-check-ins.html"
  status = 301

[[redirects]]
  from = "/training"
  to = "/services/puppy-training.html"
  status = 301
